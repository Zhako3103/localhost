# localhost-rs sample configuration (run the server from the project root)

server {
    host 127.0.0.1
    ports 8080 8081
    server_name localhost
    client_max_body_size 1M

    error_page 400 www/errors/400.html
    error_page 403 www/errors/403.html
    error_page 404 www/errors/404.html
    error_page 405 www/errors/405.html
    error_page 413 www/errors/413.html
    error_page 500 www/errors/500.html

    route / {
        methods GET HEAD
        root www
        index index.html
        autoindex off
    }

    route /files {
        methods GET
        root www/files
        autoindex on
    }

    route /upload {
        methods GET POST DELETE
        root www/uploads
        upload_dir www/uploads
        autoindex on
    }

    route /cgi-bin {
        methods GET POST
        root www/cgi-bin
        cgi .py /usr/bin/python3
    }

    route /old {
        redirect 301 /files/
    }
}

# Second virtual host on the same port: chosen by the Host header
# (e.g. curl -H 'Host: second.local' http://127.0.0.1:8080/).
# The first server for a host:port above is the default one.
server {
    host 127.0.0.1
    ports 8080
    server_name second.local
    client_max_body_size 64k

    route / {
        methods GET
        root www/second
        index index.html
    }
}
